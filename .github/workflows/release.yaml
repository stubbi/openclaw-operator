name: Release

on:
  push:
    tags:
      - 'v*'
  # Release Please dispatches this with --ref <tag> when it had to fall back to
  # GITHUB_TOKEN, whose tag pushes do not fire the push trigger above. Run it
  # manually the same way: gh workflow run release.yaml --ref vX.Y.Z
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Single source of truth for the GHCR namespace the image and the chart are
  # published to. It must match the chart's default image.repository (guarded
  # by hack/check-chart-image-repository.sh), the bundle CSV and
  # operatorhub.yaml, so it is pinned rather than derived from the repository
  # owner (which changed when the repository moved to stubbi, see #625).
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'paperclipinc' }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write  # For signing
      actions: write   # GITHUB_TOKEN fallback dispatches operatorhub.yaml
    env:
      HAS_APP: ${{ vars.RELEASE_BOT_APP_ID != '' }}
      HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}

    steps:
      # Mint a short-lived App installation token to use for actions that
      # need to trigger downstream workflows (release.yaml's events from
      # GITHUB_TOKEN don't fan-out). Replaces the long-lived
      # RELEASE_PLEASE_TOKEN PAT that was previously stored as a secret.
      # Skipped when the App is not configured (see #625); the publish step
      # then falls back to RELEASE_PLEASE_TOKEN or GITHUB_TOKEN.
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: vars.RELEASE_BOT_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN can only push to packages this repository owns or
          # has been granted access to. To publish into a namespace owned by
          # another account (ghcr.io/paperclipinc after the transfer), set
          # GHCR_PUSH_TOKEN to a PAT with write:packages from a member of that
          # namespace and GHCR_PUSH_USER to its login.
          username: ${{ vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Check image namespace matches the chart default
        run: |
          CHART_REPO=$(yq '.image.repository' charts/openclaw-operator/values.yaml)
          if [ "${CHART_REPO}" != "ghcr.io/${IMAGE_NAMESPACE}/openclaw-operator" ]; then
            echo "::error::IMAGE_NAMESPACE=${IMAGE_NAMESPACE} but the chart defaults to ${CHART_REPO}; publishing would ship a chart pointing at an image that was never pushed (#536)."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # IMAGE_NAMESPACE (workflow env) is read by .goreleaser.yaml.

      - name: Docker image name
        id: docker-image
        run: echo "name=${{ env.REGISTRY }}/${IMAGE_NAMESPACE}/openclaw-operator" >> "$GITHUB_OUTPUT"

      - name: Sign container images
        run: |
          IMAGE="${{ steps.docker-image.outputs.name }}"
          # Extract major.minor matching goreleaser's {{ .Major }}.{{ .Minor }}
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          TAGS=("latest" "${{ github.ref_name }}" "${MAJOR}.${MINOR}")

          for tag in "${TAGS[@]}"; do
            echo "Signing ${IMAGE}:${tag}..."
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
              cosign sign --yes "${IMAGE}:${tag}@${DIGEST}"
            else
              echo "Warning: could not resolve digest for ${IMAGE}:${tag}, skipping"
            fi
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.docker-image.outputs.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      - name: Attest SBOM
        run: |
          IMAGE="${{ steps.docker-image.outputs.name }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${{ github.ref_name }}" --format '{{json .Manifest}}' | jq -r '.digest')
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${IMAGE}@${DIGEST}"

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" sbom.spdx.json --clobber

      - name: Publish release
        env:
          # Events from GITHUB_TOKEN don't trigger other workflows. The App
          # token (or PAT) makes release:published fire the OperatorHub
          # submission workflow; with the GITHUB_TOKEN fallback it is
          # dispatched explicitly instead.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
          if [[ "${HAS_APP}" != "true" && "${HAS_PAT}" != "true" ]]; then
            echo "::warning::Published with GITHUB_TOKEN; dispatching operatorhub.yaml explicitly."
            gh workflow run operatorhub.yaml --repo "${{ github.repository }}" -f tag="${{ github.ref_name }}"
          fi

  helm-release:
    name: Helm Chart Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # keyless cosign signing of the chart artifact

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can only push to packages this repository owns or
          # has been granted access to. To publish into a namespace owned by
          # another account (ghcr.io/paperclipinc after the transfer), set
          # GHCR_PUSH_TOKEN to a PAT with write:packages from a member of that
          # namespace and GHCR_PUSH_USER to its login.
          username: ${{ vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Package, push, and sign Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OWNER="${IMAGE_NAMESPACE}"
          helm package charts/openclaw-operator --version "${VERSION}" --app-version "${VERSION}"
          PUSH_OUT=$(helm push "openclaw-operator-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1)
          echo "${PUSH_OUT}"
          DIGEST=$(echo "${PUSH_OUT}" | awk '/Digest:/ {print $2}')
          if [ -z "${DIGEST}" ]; then echo "::error::could not parse chart digest"; exit 1; fi
          cosign sign --yes "ghcr.io/${OWNER}/charts/openclaw-operator@${DIGEST}"
