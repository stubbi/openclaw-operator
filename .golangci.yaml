version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 200
    goconst:
      min-len: 5
      min-occurrences: 4
      # v1 did not inspect strings inside composite literals.
      exclude-types:
        - Call
        - CompositeLit
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
    staticcheck:
      # Preserve the v1 staticcheck/gosimple/stylecheck checks, without QF suggestions.
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files can have longer functions and duplication.
      - linters:
          - dupl
          - goconst
          - gosec
        path: _test\.go
      # v1 noctx only checked HTTP calls; retain existing test command helpers.
      - linters:
          - noctx
        path: _test\.go
        text: os/exec.Command must not be called
      # SA5011 false positive: staticcheck does not track t.Fatal as a terminator.
      - linters:
          - staticcheck
        path: _test\.go
        text: SA5011
    paths:
      - zz_generated
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/paperclipinc/openclaw-operator
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
